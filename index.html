个。\n- 教学机构：19 个学院；本科专业 52 个。\n- 在校生规模：普通本科生 1.9 万余人，研究生 5800 余人，留学生 500 余人。\n- 专任教师：1600 余人。\n\n【七、常见问答速查（机器人可据此回答）】\nQ：中国计量大学的校训是什么？            A：精思国计，细量民生。\nQ：中国计量大学是什么时候创办的？        A：1978 年 10 月 5 日，前身为国家计量总局创建的杭州计量学校。\nQ：中国计量大学什么时候更名的？          A：2016 年由\"中国计量学院\"更名为\"中国计量大学\"。\nQ：中国计量大学的特色专业有哪些？        A：见【五】，其中标准化工程、质量管理工程全国排名第 1；\n                                            测控技术与仪器、光电信息科学与工程、自动化等为国家级特色/一流专业。\nQ：中国计量大学在哪个城市？有几个校区？  A：浙江省杭州市，现有东、西两个校区，位于钱塘区下沙高教园区。\nQ：中国计量大学是 211/985 吗？          A：都不是；它是浙江省重点建设高校、浙江省与国家市场监督管理总局共建高校。\nQ：中国计量大学的地址和邮编？            A：西校区（本部）杭州市钱塘区下沙高教园区学源街 258 号。\n\n【八、数据来源】\n- 百度百科：中国计量大学词条（学校概况、历史沿革、基本信息栏）。\n- 中国计量大学官网：校区位置、校训相关新闻、逸夫计量博物馆页面（页面受 WAF 保护）。\n- 大学生必备网（m.dxsbb.com）：中国计量大学王牌专业/国家级与省级一流专业名单。\n- 高考100（gk100.com）：中国计量大学专业排名一览表、国家/省级一流本科专业名单、软科专业排名。\n\n【九、数据缺失清单（需人工补充，严禁编造）】\n1. 校训\"精思国计，细量民生\"的官方完整释义原文（官网页面被 WAF 拦截，未采集到）。\n2. 学校现任校长姓名（公开百科仅列党委书记，校长信息未确认）。\n3. 义乌校区/现代科技学院（义乌）当前的办学状态与地址（未获官方确认）。\n4. 各专业最新招生计划与录取分数线（年份敏感，未写入知识库，避免过期错误）。\n5. 学校各学院院系设置的完整清单（仅确认学院总数为 19 个）。\n";

/* ============ 1. 客户端切块（按章节→段落，单块≤600字） ============ */
var MAX_CHUNK = 600;
function chunkKB(text) {
  var lines = text.split(/\r?\n/);
  var sections = [];
  var cur = null;
  for (var i = 0; i < lines.length; i++) {
    var m = lines[i].match(/^【([^】]+)】/);
    if (m) { if (cur) sections.push(cur); cur = { title: m[1], body: [] }; }
    else if (cur) cur.body.push(lines[i]);
    else cur = { title: '', body: [lines[i]] };
  }
  if (cur) sections.push(cur);
  var chunks = [];
  for (var s = 0; s < sections.length; s++) {
    var paras = sections[s].body.join('\n').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
    var buf = '';
    for (var p = 0; p < paras.length; p++) {
      if (buf && (buf + '\n' + paras[p]).length > MAX_CHUNK) { chunks.push({ text: buf, title: sections[s].title }); buf = paras[p]; }
      else buf = buf ? buf + '\n' + paras[p] : paras[p];
      while (buf.length > MAX_CHUNK) { chunks.push({ text: buf.slice(0, MAX_CHUNK), title: sections[s].title }); buf = buf.slice(MAX_CHUNK); }
    }
    if (buf.trim()) chunks.push({ text: buf, title: sections[s].title });
  }
  return chunks;
}
var CHUNKS = chunkKB(KB);

function bigrams(t) {
  var c = String(t || '').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
  var s = {};
  for (var i = 0; i < c.length - 1; i++) s[c.slice(i, i + 2)] = 1;
  return s;
}
function retrieve(q, topK) {
  var qb = bigrams(q);
  return CHUNKS.map(function (c) {
    var b = bigrams(c.text); var n = 0;
    for (var k in qb) if (b[k]) n++;
    return { chunk: c, score: n };
  }).sort(function (a, b) { return b.score - a.score; }).slice(0, topK || 3);
}

/* ============ 2. 客户端双闸门（别名快判 + 模型兜底） ============ */
var ALIASES = ['中国计量大学','中量大','量大','CJLU','计量大学','计量','本校','我校','学校','校园','校区','校训','校歌','校庆','学院','专业','学科','招生','录取','考研','研究生','博士','硕士','老师','教师','学生','宿舍','食堂','图书馆','课程','考试','社团','逸夫','博物馆','下沙','学源街','就业','奖学金','毕业','培养','知识产权','光电','测控','自动化','安全工程','食品','工商管理','标准化','学费','分数线','自习室','操场'];
var OFFTOPIC = [/讲个?笑话|讲个?段子|说个?笑话/, /写(一段|一个|个)?(代码|程序|脚本|贪吃蛇|函数|算法)|python|java|javascript|c\+\+|html|css/, /天气|气温|下雨|下雪|台风|空气质量/, /股票|基金|比特币|炒股|期货|彩票/, /做(红烧肉|饭|菜|蛋糕|面包|奶茶)|菜谱|怎么做饭/, /其他大学|北京大学|清华大学|复旦大学|浙江大学|上海交大|哈佛|麻省|斯坦福|牛津|剑桥/, /唱歌|跳舞|画画|作曲|写诗|写小说|写歌/, /翻译(一下|成)?|帮我翻译/, /美国总统|特朗普|拜登|俄乌|世界杯|NBA|欧冠|明星|娱乐圈/, /帮我(算|解|求)|1\+1|方程|微积分/];
var GREETINGS = [/^(你好|您好|你们好|hi|hello|嗨|在吗|在么|早上好|中午好|晚上好|老师好)[\s!！。.~～]*$/i];
var IDENTITY = [/^(你是谁|你叫什么|介绍一下你自己|你是什么|你是干嘛的|你是做什么的)[?？!！。.]*$/i];

function quickGate(q) {
  var s = q.trim();
  if (!s) return 'offtopic';
  for (var i = 0; i < GREETINGS.length; i++) if (GREETINGS[i].test(s)) return 'campus';
  for (var i = 0; i < IDENTITY.length; i++) if (IDENTITY[i].test(s)) return 'campus';
  for (var i = 0; i < ALIASES.length; i++) if (s.indexOf(ALIASES[i]) >= 0) return 'campus';
  for (var i = 0; i < OFFTOPIC.length; i++) if (OFFTOPIC[i].test(s)) return 'offtopic';
  return 'unknown';
}

}

var COOLDOWN_MS = 8000;
var DAILY_CAP = 100;
var LS_KEY = 'cjlu_qa_limits_v1';
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function today() { return new Date().toISOString().slice(0, 10); }
function loadLimits() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } }
function usage() { var l = loadLimits(); if (l.day !== today()) return { count: 0, lastAt: 0 }; return { count: l.count || 0, lastAt: l.lastAt || 0 }; }
function recordUse() { var u = usage(); localStorage.setItem(LS_KEY, JSON.stringify({ day: today(), count: u.count + 1, lastAt: Date.now() })); }
function checkAllowed() {
  var u = usage(); var now = Date.now();
  if (now - (u.lastAt || 0) < COOLDOWN_MS) return { ok: false, msg: '请稍候几秒再问（防刷保护）' };
  if (u.count >= DAILY_CAP) return { ok: false, msg: '今日演示次数已达上限，请明天再来' };
  return { ok: true };
}

var REFUSAL = '抱歉，我是中国计量大学的校园问答机器人，只能回答与本校校园相关的问题哦～\n你可以试着问我："我们学校的特色专业是什么？"';
var BADGE_LABEL = { knowledge: '知识库命中', general: '大模型泛答', refusal: '拒答' };

var chatEl = document.getElementById('chat');
var inputEl = document.getElementById('input');
var sendBtn = document.getElementById('send');
var badgeEl = document.getElementById('badge');
var footEl = document.getElementById('foot');
var busy = false;

function refreshBadge() {
  var u = usage();
  badgeEl.textContent = 'DeepSeek 在线 · 今日 ' + u.count + '/' + DAILY_CAP;
  footEl.textContent = '演示版 · 已开启防刷限流（每问间隔 ' + (COOLDOWN_MS / 1000) + ' 秒，每日上限 ' + DAILY_CAP + ' 次）';
}
function addMsg(role, text, srcBadge) {
  var wrap = document.createElement('div');
  wrap.className = 'bubble ' + role;
  wrap.innerHTML = '<div class="avatar">' + (role === 'user' ? '我' : '量') + '</div><div class="msg-body"><div class="text"></div>'
    + (srcBadge ? '<span class="src-badge src-' + srcBadge + '">' + (BADGE_LABEL[srcBadge] || srcBadge) + '</span>' : '') + '</div>';
  wrap.querySelector('.text').innerHTML = md(text);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}
function showTyping(on) {
  if (on) {
    busy = true; sendBtn.disabled = true;
    var t = document.createElement('div'); t.className = 'bubble assistant'; t.id = 'typing';
    t.innerHTML = '<div class="avatar">量</div><div class="msg-body"><div class="text typing">正在思考…</div></div>';
    chatEl.appendChild(t); chatEl.scrollTop = chatEl.scrollHeight;
  } else {
    busy = false; sendBtn.disabled = false;
    var el = document.getElementById('typing'); if (el) el.remove();
  }
}

async function send(text) {
  var q = (text || inputEl.value).trim();
  if (!q || busy) return;
  var allow = checkAllowed();
  if (!allow.ok) { addMsg('assistant', allow.msg, 'refusal'); return; }
  addMsg('user', q); inputEl.value = ''; showTyping(true);

  // 双闸门第一道：别名快判
  if (quickGate(q) === 'offtopic') { showTyping(false); addMsg('assistant', REFUSAL, 'refusal'); return; }

  // 检索 Top-3 片段
  var top = retrieve(q, 3);
  var hit = top.length > 0 && top[0].score >= 1;
  var system = buildSystem(hit ? top : []);

  try {
    var resp = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + DEEPSEEK_KEY },
      body: JSON.stringify({ model: 'deepseek-chat', temperature: 0.3, max_tokens: 512,
        messages: [{ role: 'system', content: system }, { role: 'user', content: q }] })
    });
    if (!resp.ok) {
      var detail = await resp.text();
      throw new Error('接口 ' + resp.status + '：' + (detail || '').slice(0, 160));
    }
    var data = await resp.json();
    var reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '（未返回内容）';
    reply = reply.trim();
    var srcBadge = hit ? 'knowledge' : 'general';
    if (hit) reply = reply + '\n\n【来源：CJLU.txt】';
    addMsg('assistant', reply, srcBadge);
    recordUse(); refreshBadge();
  } catch (e) {
    addMsg('assistant', '出错了：' + esc(e.message || e) + '\n请稍后重试。', 'general');
  } finally {
    showTyping(false);
  }
}

var QUICK = ['我们学校的特色专业是什么？', '中国计量大学的校训是什么？', '学校有几个校区？在哪里？', '今天杭州天气怎么样？'];
var quickEl = document.getElementById('quick');
QUICK.forEach(function (q) {
  var b = document.createElement('button'); b.textContent = q;
  b.onclick = function () { send(q); };
  quickEl.appendChild(b);
});
sendBtn.onclick = function () { send(); };
inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
refreshBadge();
</script>
</body>
</html>
