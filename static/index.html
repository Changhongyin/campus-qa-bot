<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="中国计量大学校园问答助手演示页。">
  <meta name="ldzd-api-base" content="">
  <title>量大智答｜中国计量大学校园问答助手</title>
  <style>
    :root {
      color: #17243a;
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
      background: #f4f7fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(150deg, #f5f8ff 0%, #fbfcfe 48%, #effaf6 100%);
    }
    button, textarea { font: inherit; }
    button:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(31, 95, 214, .4);
      outline-offset: 3px;
    }
    .page {
      display: flex;
      width: min(100% - 32px, 900px);
      min-height: 100vh;
      flex-direction: column;
      margin: 0 auto;
      padding: 24px 0 12px;
    }
    .header, .chat, .composer {
      border: 1px solid rgba(207, 221, 240, .9);
      border-radius: 18px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 12px 34px rgba(29, 63, 112, .08);
    }
    .header { display: flex; align-items: center; gap: 14px; padding: 16px 20px; }
    .logo {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(135deg, #1f5fd6, #17a673);
      font-size: 23px;
      font-weight: 800;
    }
    h1 { margin: 0; color: #16263f; font-size: 20px; }
    .subtitle { margin: 5px 0 0; color: #63748c; font-size: 13px; }
    .status {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 9px;
      border-radius: 999px;
      color: #52647d;
      background: #edf2f8;
      font-size: 11px;
    }
    .chat {
      display: flex;
      min-height: 360px;
      max-height: min(60vh, 620px);
      flex: 1;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      margin: 16px 0 12px;
      padding: 18px;
    }
    .bubble { display: flex; align-items: flex-start; gap: 10px; }
    .bubble.user { flex-direction: row-reverse; }
    .avatar {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #1f5fd6;
      font-size: 13px;
      font-weight: 700;
    }
    .bubble.user .avatar { background: #17a673; }
    .message {
      max-width: min(78%, 690px);
      padding: 10px 14px;
      border-radius: 4px 14px 14px;
      color: #26364e;
      background: #f1f5fb;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .bubble.user .message {
      border-radius: 14px 4px 14px 14px;
      background: #e8f7ef;
    }
    .notice {
      padding: 10px 12px;
      border-radius: 10px;
      color: #805f19;
      background: #fff6df;
      font-size: 13px;
      line-height: 1.6;
    }
    .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
    .quick button, .secondary {
      min-height: 36px;
      padding: 6px 11px;
      border: 1px solid #cfddf0;
      border-radius: 999px;
      color: #285ba8;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 11px;
    }
    .composer textarea {
      min-height: 44px;
      max-height: 150px;
      flex: 1;
      resize: vertical;
      border: 1px solid #cdd9ea;
      border-radius: 12px;
      padding: 11px 13px;
      color: #17243a;
      line-height: 1.5;
    }
    .send {
      min-height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(135deg, #1f5fd6, #17a673);
      cursor: pointer;
      font-weight: 700;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .foot { margin: 12px 0 0; color: #74839a; text-align: center; font-size: 12px; }
    @media (max-width: 480px) {
      .page { width: 100%; min-height: 100dvh; padding: 10px; }
      .header { padding: 13px; }
      h1 { font-size: 17px; }
      .chat { min-height: 300px; max-height: 58dvh; padding: 13px; }
      .message { max-width: 84%; }
      .composer { padding: 9px; }
      .send { padding: 0 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="logo" aria-hidden="true">量</div>
      <div>
        <h1>量大智答</h1>
        <p class="subtitle">中国计量大学校园问答助手 <span class="status" id="status">服务状态待确认</span></p>
      </div>
    </header>

    <section class="chat" id="chat" aria-label="对话内容" aria-live="polite">
      <div class="bubble assistant">
        <div class="avatar" aria-hidden="true">量</div>
        <div class="message">你好，我是量大智答。你可以向我提问校园学习与生活相关的问题。</div>
      </div>
    </section>

    <div class="quick" id="quick" aria-label="常见问题"></div>

    <form class="composer" id="composer">
      <label for="input" class="visually-hidden">输入校园问题</label>
      <textarea id="input" maxlength="2000" rows="1" placeholder="输入校园问题，按 Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="send" type="submit" disabled>发送</button>
    </form>
    <p class="foot" id="foot">请勿在对话中输入密码或其他敏感个人信息。</p>
  </main>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
  <script>
    (() => {
      const metaBase = document.querySelector('meta[name="ldzd-api-base"]')?.content.trim() ?? '';
      const queryBase = new URLSearchParams(window.location.search).get('api')?.trim() ?? '';
      const candidate = queryBase || metaBase || window.location.origin;
      let apiBase = window.location.origin;

      try {
        const parsed = new URL(candidate, window.location.origin);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
          apiBase = parsed.href.replace(/\/+$/, '');
        }
      } catch {
        apiBase = window.location.origin;
      }

      const chatElement = document.getElementById('chat');
      const inputElement = document.getElementById('input');
      const sendButton = document.getElementById('send');
      const composer = document.getElementById('composer');
      const statusElement = document.getElementById('status');
      const footElement = document.getElementById('foot');
      const quickElement = document.getElementById('quick');
      const conversation = [{ role: 'assistant', content: '你好，我是量大智答。你可以向我提问校园学习与生活相关的问题。' }];
      let busy = false;

      function addMessage(role, text, badge) {
        const row = document.createElement('div');
        row.className = `bubble ${role}`;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = role === 'user' ? '我' : '量';
        const message = document.createElement('div');
        message.className = 'message';
        message.textContent = text;
        if (badge) message.setAttribute('aria-label', `${badge}：${text}`);
        row.append(avatar, message);
        chatElement.append(row);
        chatElement.scrollTop = chatElement.scrollHeight;
      }

      function setBusy(value) {
        busy = value;
        sendButton.disabled = value || inputElement.value.trim().length === 0;
        inputElement.disabled = value;
        quickElement.querySelectorAll('button').forEach((button) => {
          button.disabled = value;
        });
      }

      async function send(value) {
        const question = (value ?? inputElement.value).trim();
        if (!question || busy) return;

        addMessage('user', question);
        conversation.push({ role: 'user', content: question });
        inputElement.value = '';
        setBusy(true);

        const pending = document.createElement('div');
        pending.className = 'notice';
        pending.textContent = '正在整理回答…';
        chatElement.append(pending);
        chatElement.scrollTop = chatElement.scrollHeight;

        try {
          const response = await fetch(`${apiBase}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({
              messages: conversation.filter((message) => message.role === 'user' || message.role === 'assistant').slice(-10),
              stream: false
            })
          });

          if (!response.ok) {
            let message = '问答服务暂时无法处理请求。';
            try {
              const payload = await response.json();
              if (typeof payload.error === 'string') message = payload.error;
            } catch {
              message = '问答服务暂时无法处理请求。';
            }
            throw new Error(message);
          }

          const payload = await response.json();
          if (typeof payload.reply !== 'string') throw new Error('服务暂时没有返回有效回答。');
          const reply = payload.reply;
          conversation.push({ role: 'assistant', content: reply });
          addMessage('assistant', reply, typeof payload.badge === 'string' ? payload.badge : '');
          statusElement.textContent = payload.mode === 'offline' ? '离线问答模式' : '问答服务已连接';
        } catch (error) {
          const reason = error instanceof Error ? error.message : '网络连接失败，请检查服务后重试。';
          addMessage('assistant', `暂时无法获取回答：${reason}`);
          conversation.pop();
          statusElement.textContent = '服务暂不可用';
        } finally {
          pending.remove();
          setBusy(false);
          inputElement.focus();
        }
      }

      [
        '我们学校的特色专业是什么？',
        '中国计量大学的校训是什么？',
        '学校有几个校区？在哪里？'
      ].forEach((question) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = question;
        button.addEventListener('click', () => void send(question));
        quickElement.append(button);
      });

      composer.addEventListener('submit', (event) => {
        event.preventDefault();
        void send();
      });

      inputElement.addEventListener('input', () => {
        sendButton.disabled = busy || inputElement.value.trim().length === 0;
      });

      inputElement.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          void send();
        }
      });

      window.addEventListener('unhandledrejection', () => {
        statusElement.textContent = '服务暂不可用';
      });
    })();
  </script>
</body>
</html>
